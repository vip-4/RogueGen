<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{game_title}</title>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <style>
    body { margin:0; background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#eee; font-family:system-ui; }
    canvas { border:4px solid #ffd700; border-radius:12px; }
    .hud { margin-top:12px; text-align:center; width:360px; }
    .row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; }
    button { padding:8px 16px; font-size:14px; font-weight:700; border:none; border-radius:8px; background:linear-gradient(135deg,#ffd700,#ff8c00); color:#222; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .bet-btn { background:#333; color:#ffd700; border:1px solid #ffd700; }
    .bet-btn.active { background:#ffd700; color:#222; }
    #status { margin-top:8px; color:#0ff; font-size:14px; min-height:18px; }
  </style>
</head>

  <canvas id="pixi-canvas"></canvas>

    <div class="row"><span>积分：<b id="score">0</b></span><span>最佳：<b id="best">0</b></span></div>
    <div class="row"><span>押注：<b id="bet">10</b></span><span>免费旋转：<b id="free">0</b></span><span>倍率：<b id="mult">x1</b></span></div>
    <div class="row">
      <button class="bet-btn" data-bet="10">10</button>
      <button class="bet-btn" data-bet="20">20</button>
      <button class="bet-btn" data-bet="50">50</button>
      <button id="spinBtn">SPIN</button>
    </div>
    <div id="status">准备就绪</div>
  </div>

  (function () {
    const g = window;
    function isNative(){ return !!(g.webkit && g.webkit.messageHandlers) || !!g.NativeBridge || !!g.AndroidBridge; }
    const listeners = { pause:new Set(), resume:new Set(), networkChange:new Set() };
    const bridge = {
      isNative: isNative(),
      vibrate(p){ if(this.isNative){ try{ const b=(g.NativeBridge||g.AndroidBridge||{}); if(b.vibrate) b.vibrate(JSON.stringify({pattern:p})); }catch(e){} } else if(navigator.vibrate) navigator.vibrate(p); },
      savePersistent(k,v){ if(this.isNative){ try{ const b=(g.NativeBridge||g.AndroidBridge||{}); if(b.savePersistent) b.savePersistent(JSON.stringify({key:k,value:v})); }catch(e){} } else try{ localStorage.setItem(k,v); }catch(e){} },
      loadPersistent(k){ if(this.isNative) return null; try{ return localStorage.getItem(k); }catch(e){ return null; } },
      on(ev,cb){ if(listeners[ev]) listeners[ev].add(cb); return ()=>listeners[ev]&&listeners[ev].delete(cb); },
    };
    g.HybridBridge = { default: bridge, bridge: bridge };
    g.__hybridBridgeReceive = function(msg){ if(msg && msg.type && listeners[msg.type]) listeners[msg.type].forEach(cb=>cb(msg.payload)); };
    window.addEventListener('message', function(e){ if(e.data && e.data.source==='native' && e.data.payload) g.__hybridBridgeReceive(e.data.payload); });
  })();

    let score=0, best=0, bet=10, freeSpins=0, mult=1;
    const bridge = window.HybridBridge ? (window.HybridBridge.default || window.HybridBridge.bridge) : null;
    try { const s = bridge ? bridge.loadPersistent('slot_best') : localStorage.getItem('slot_best'); if (s) best = parseInt(s,10)||0; } catch(e){}
    const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
    const statusEl=document.getElementById('status'), spinBtn=document.getElementById('spinBtn');
    const betEl=document.getElementById('bet'), freeEl=document.getElementById('free'), multEl=document.getElementById('mult');
    scoreEl.textContent=score; bestEl.textContent=best; betEl.textContent=bet; freeEl.textContent=freeSpins; multEl.textContent='x'+mult;

    let spinSound, winSound, bonusSound;
    try { spinSound=new Howl({src:[BEEP],volume:0.35,rate:1.3}); winSound=new Howl({src:[BEEP],volume:0.6,rate:0.9}); bonusSound=new Howl({src:[BEEP],volume:0.5,rate:0.6}); } catch(e){ spinSound=winSound=bonusSound=null; }
    function play(s){ try{ if(s) s.play(); }catch(e){} }

    const app=new PIXI.Application({view:document.getElementById('pixi-canvas'),width:REELS*CELL,height:ROWS*CELL+20,backgroundColor:0x0a0a1a,antialias:true});
    const container=new PIXI.Container(); app.stage.addChild(container);
    const reelTexts=[];
    for(let r=0;r<REELS;r++){const col=[];for(let row=0;row<ROWS;row++){const t=new PIXI.Text(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)],{fontSize:46,fill:0xffffff,fontFamily:'serif'}); t.anchor.set(0.5); t.x=r*CELL+CELL/2; t.y=row*CELL+CELL/2; container.addChild(t); col.push(t);} reelTexts.push(col);}
    const line=new PIXI.Graphics(); line.lineStyle(2,0xffd700,0.6); line.moveTo(0,CELL+CELL/2); line.lineTo(REELS*CELL,CELL+CELL/2); app.stage.addChild(line);

    let spinning=false;
    document.querySelectorAll('.bet-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        if(spinning) return;
        bet=parseInt(b.dataset.bet,10);
        document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        betEl.textContent=bet;
      });
    });
    const firstBet = document.querySelector('.bet-btn[data-bet="10"]');
    if (firstBet) firstBet.classList.add('active');

    function spin(){
      if(spinning) return;
      const isFree = freeSpins>0;
      if(!isFree && score < bet){ statusEl.textContent='积分不足'; return; }
      if(!isFree){ score -= bet; scoreEl.textContent=score; }
      else { freeSpins--; freeEl.textContent=freeSpins; }
      spinning=true; spinBtn.disabled=true;
      statusEl.textContent = isFree ? '免费旋转中...' : '旋转中...';
      play(spinSound);
      const result=[]; let bonusCount=0;
      for(let r=0;r<REELS;r++){const col=[];for(let row=0;row<ROWS;row++){const sym=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]; col.push(sym); if(sym===BONUS_SYMBOL) bonusCount++;} result.push(col);}
      const triggerFree = bonusCount>=3;
      let delay=0;
      for(let r=0;r<REELS;r++){ setTimeout(()=>{ for(let row=0;row<ROWS;row++){ reelTexts[r][row].text=result[r][row]; reelTexts[r][row].scale.set(0.2); let t=0; const step=()=>{t+=0.05; const s=0.2+(1-0.2)*Math.min(t,1); reelTexts[r][row].scale.set(s); if(t<1) requestAnimationFrame(step);}; requestAnimationFrame(step);} play(spinSound); if(r===REELS-1) setTimeout(()=>evaluate(result,triggerFree),400); }, delay); delay+=500; }
    }

    function evaluate(result, triggerFree){
      const mid=result.map(c=>c[1]);
      let win=0;
      if(mid[0]===mid[1]&&mid[1]===mid[2]) win=bet*10*mult;
      else if(mid[0]===mid[1]||mid[1]===mid[2]||mid[0]===mid[2]) win=bet*2*mult;
      if(triggerFree){ freeSpins+=5; freeEl.textContent=freeSpins; play(bonusSound); statusEl.textContent='触发 5 次免费旋转！ '+mid.join(' '); mult=2; multEl.textContent='x'+mult; }
      else if(win>0){ statusEl.textContent='中奖 +'+win+'  '+mid.join(' '); play(winSound); }
      else { statusEl.textContent='再试一次  '+mid.join(' '); mult=1; multEl.textContent='x'+mult; }
      if(win>0){ score+=win; scoreEl.textContent=score; if(bridge) bridge.vibrate([100,50,100]); else if(navigator.vibrate) navigator.vibrate([100,50,100]); if(score>best){best=score; bestEl.textContent=best; try{ if(bridge) bridge.savePersistent('slot_best',String(best)); else localStorage.setItem('slot_best',String(best)); }catch(e){} } }
      spinning=false; spinBtn.disabled=false;
    }

    spinBtn.addEventListener('click', spin);
    if(bridge){ bridge.on('pause',()=>{statusEl.textContent='已切后台';}); bridge.on('resume',()=>{statusEl.textContent='已恢复';}); }
